[package]
name = "arclight"
version = "0.3.0"
edition = "2024"
description = "A native Linux launcher for World of Warcraft"

[dependencies]
# GUI
iced = { version = "0.14", features = ["tokio", "selector", "image"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization & config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Filesystem paths
dirs = "6"

# Image header checks for downloaded artwork
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# HTTP client (for auth & patching later)
reqwest = { version = "0.13", features = ["json", "stream"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Process & system
which = "8"

# Clipboard
arboard = "3"

# Time
chrono = "0.4"

# Native file dialogs
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
